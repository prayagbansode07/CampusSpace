
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | CampusSpace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .confirmation-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
        }

        .success-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            color: #166534;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
            line-height: 1.6;
        }

        .booking-details {
            text-align: left;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:first-child {
            padding-top: 0;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: #64748b;
        }

        .detail-value {
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: block;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .primary-button {
            background: #2563eb;
            color: #ffffff;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            background: #e2e8f0;
            color: #334155;
        }

        .secondary-button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 480px) {
            .confirmation-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="confirmation-card">

        <div class="success-icon">&#10003;</div>

        <h1>Booking Confirmed!</h1>

        <p class="subtitle">
            Thank you, <strong>{{ name }}</strong>!
            Your room booking has been successfully submitted.
        </p>

        <section class="booking-details">
            <div class="detail-row">
                <span class="detail-label">Room</span>
                <span class="detail-value">{{ room["name"] }}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value">{{ booking_date }}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Time</span>
                <span class="detail-value">{{ booking_time }}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Duration</span>
                <span class="detail-value">{{ duration }} hour(s)</span>
            </div>
        </section>

        <div class="buttons">
            <a href="{{ url_for('my_bookings') }}"
               class="button primary-button">
                View My Bookings
            </a>

            <a href="{{ url_for('home') }}"
               class="button secondary-button">
                Back to CampusSpace
            </a>
        </div>

    </main>
</body>
</html>
