<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Lecture - CampusSpace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe7f1);
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #172033;
            color: white;
            padding: 28px 6%;
            box-shadow: 0 4px 18px rgba(23, 32, 51, 0.12);
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        header p {
            margin-top: 7px;
            color: #d7deea;
            font-size: 14px;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 42px 25px 70px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            color: #172033;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: #52627d;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px;
            border: 1px solid #e0e6ed;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(23, 32, 51, 0.10);
        }

        h2 {
            color: #172033;
            font-size: 24px;
            line-height: 1.3;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 21px;
        }

        .full {
            grid-column: span 2;
        }

        label {
            display: block;
            color: #344054;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            min-height: 47px;
            padding: 12px 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            color: #172033;
            background: white;
            font-family: inherit;
            font-size: 14px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:hover,
        select:hover {
            border-color: #98a2b3;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #172033;
            box-shadow: 0 0 0 3px rgba(23, 32, 51, 0.12);
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-top: 30px;
        }

        .save-button,
        .cancel-button {
            min-height: 47px;
            padding: 12px 21px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .save-button {
            border: 1px solid #172033;
            background: #172033;
            color: white;
        }

        .save-button:hover {
            background: #26344f;
            border-color: #26344f;
            transform: translateY(-1px);
        }

        .cancel-button {
            border: 1px solid #d0d5dd;
            background: white;
            color: #344054;
        }

        .cancel-button:hover {
            border-color: #98a2b3;
            background: #f8fafc;
            transform: translateY(-1px);
        }

        @media (max-width: 700px) {

            header {
                padding: 24px 20px;
            }

            header h1 {
                font-size: 23px;
            }

            main {
                padding: 30px 15px 50px;
            }

            .card {
                padding: 28px 22px;
                border-radius: 14px;
            }

            h2 {
                font-size: 21px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .full {
                grid-column: span 1;
            }

            .buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .save-button,
            .cancel-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>CampusSpace</h1>

    <p>Edit Lecture</p>

</header>


<main>


    <a href="/admin/timetable" class="back">
        ← Back to Timetable
    </a>


    <div class="card">

        <h2>Edit Lecture</h2>


        <form method="POST">


            <div class="form-grid">


                <div>

                    <label for="room_id">
                        Room
                    </label>

                    <select
                        id="room_id"
                        name="room_id"
                        required>

                        {% for room in rooms %}

                            <option
                                value="{{ room['id'] }}"
                                {% if room['id'] == lecture['room_id'] %}
                                    selected
                                {% endif %}>

                                {{ room['name'] }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div>

                    <label for="day">
                        Day
                    </label>

                    <select
                        id="day"
                        name="day"
                        required>

                        {% for day in [
                            'Monday',
                            'Tuesday',
                            'Wednesday',
                            'Thursday',
                            'Friday',
                            'Saturday',
                            'Sunday'
                        ] %}

                            <option
                                value="{{ day }}"
                                {% if lecture['day'] == day %}
                                    selected
                                {% endif %}>

                                {{ day }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div>

                    <label for="start_time">
                        Start Time
                    </label>

                    <input
                        type="time"
                        id="start_time"
                        name="start_time"
                        value="{{ lecture['start_time'] }}"
                        required>

                </div>


                <div>

                    <label for="end_time">
                        End Time
                    </label>

                    <input
                        type="time"
                        id="end_time"
                        name="end_time"
                        value="{{ lecture['end_time'] }}"
                        required>

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        value="{{ lecture['subject'] }}"
                        required>

                </div>


                <div>

                    <label for="class_name">
                        Class / Division
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        name="class_name"
                        value="{{ lecture['class_name'] }}"
                        required>

                </div>


                <div class="full">

                    <label for="faculty_name">
                        Faculty
                    </label>

                    <input
                        type="text"
                        id="faculty_name"
                        name="faculty_name"
                        value="{{ lecture['faculty_name'] }}"
                        required>

                </div>


            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-button">

                    Save Changes

                </button>


                <a
                    href="/admin/timetable"
                    class="cancel-button">

                    Cancel

                </a>

            </div>


        </form>


    </div>


</main>


</body>

</html>
