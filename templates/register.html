<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CampusSpace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe7f1);
            color: #172033;
        }

        nav {
            min-height: 72px;
            background: #172033;
            padding: 0 6%;
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border: 1px solid #dfe3e8;
            border-radius: 14px;
            box-shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 30px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 28px;
            font-size: 15px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field {
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #cfd4dc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #172033;
            box-shadow: 0 0 0 3px rgba(23, 32, 51, 0.1);
        }

        button {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            background: #172033;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: #27334a;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-link a {
            color: #172033;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 20px;
            }

            nav a {
                font-size: 21px;
            }

            .container {
                margin: 30px auto;
            }

            .card {
                padding: 28px 22px;
            }
        }
            .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            width: auto;
            margin: 0;
            padding: 5px 8px;
            background: transparent;
            color: #172033;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .show-password:hover {
            background: transparent;
            color: #667085;
        }
        .flash-container {
            margin-bottom: 20px;
        }

        .flash-message {
            padding: 13px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            border: 1px solid transparent;
        }

        .flash-success {
            background: #eaf7ee;
            color: #176b35;
            border-color: #b8e2c4;
        }

        .flash-error {
            background: #fff0f0;
            color: #a12626;
            border-color: #f0bcbc;
        }

        .flash-info {
            background: #eef4ff;
            color: #214f9b;
            border-color: #c5d7ff;
        }
    </style>

</head>


<body>


<nav>

    <a href="/">
        CampusSpace
    </a>

</nav>


<div class="container">

    <div class="card">

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Register for CampusSpace
        </p>
        <div class="flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST"
              action="/register">


            <!-- NAME -->

            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('register-password', this)"
                    >
                        Show
                    </button>
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="field">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="register-confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('register-confirm-password', this)"
                    >
                        Show
                    </button>
                </div>

            </div>


            <!-- ACCOUNT TYPE -->

            <div class="field">

                <label for="requested_role">
                    Account Type
                </label>

                <select
                    id="requested_role"
                    name="requested_role"
                    required
                >

                    <option value="student">
                        Student
                    </option>

                    <option value="faculty">
                        Faculty
                    </option>

                </select>

            </div>


            <!-- REGISTER -->

            <button type="submit">
                Register
            </button>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }
</script>
</body>

</html>
